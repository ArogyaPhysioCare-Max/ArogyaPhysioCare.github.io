<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF9D" />
      <stop offset="50%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#05B378" />
    </linearGradient>

    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE599" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(15, 10)">
    <!-- Shield / Spine Backdrop Ring -->
    <circle cx="50" cy="50" r="44" fill="none" stroke="url(#emeraldGlow)" stroke-width="2" stroke-dasharray="8 4" opacity="0.6"/>
    <circle cx="50" cy="50" r="38" fill="#041A14" stroke="url(#emeraldGlow)" stroke-width="1.5" />

    <!-- Stylized Spine Nodes (Futuristic Vertabrae) -->
    <circle cx="50" cy="22" r="3.5" fill="url(#emeraldGlow)" filter="url(#neonGlow)"/>
    <circle cx="50" cy="33" r="4" fill="url(#emeraldGlow)" />
    <circle cx="50" cy="45" r="4.5" fill="url(#emeraldGlow)" />
    <circle cx="50" cy="58" r="4" fill="url(#emeraldGlow)" />
    <circle cx="50" cy="70" r="3.5" fill="url(#emeraldGlow)" />
    <circle cx="50" cy="80" r="3" fill="url(#emeraldGlow)" />

    <!-- Dynamic Healing Leaf / Motion Arc -->
    <path d="M 28,62 C 20,40 38,20 50,22 C 62,20 80,40 72,62 C 65,78 50,88 50,88 C 50,88 35,78 28,62 Z" 
          fill="none" stroke="url(#emeraldGlow)" stroke-width="3" stroke-linecap="round" filter="url(#neonGlow)" />

    <!-- Inner Vital Pulse Line -->
    <path d="M 32,50 L 42,50 L 46,38 L 52,64 L 57,45 L 61,50 L 68,50" 
          fill="none" stroke="url(#goldAccent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Typography -->
  <!-- Main Brand Name -->
  <text x="125" y="58" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="34" fill="#FFFFFF" letter-spacing="1">
    AROGYA
  </text>
  <text x="260" y="58" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="300" font-size="34" fill="#00FF9D" letter-spacing="1">
    PHYSIO
  </text>
  
  <!-- Subtitle / Tagline -->
  <text x="126" y="84" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" fill="#94A3B8" letter-spacing="3">
    ADVANCED REHAB &amp; MOBILITY CARE
  </text>

  <text x="126" y="98" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="10" fill="url(#goldAccent)" letter-spacing="1.5">
    📍 ADANI SHANTIGRAM, AHMEDABAD
  </text>
</svg>
